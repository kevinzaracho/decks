<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Decks</title>
    <style>
      :root { color-scheme: light dark; --bg: #f3f5f9; --card: #ffffff; --ink: #1b2232; --muted: #56688c; --line: #dbe0eb; --accent: #c8007a; }
      @media (prefers-color-scheme: dark) { :root { --bg: #111522; --card: #1a2032; --ink: #eef1f7; --muted: #a3b0cc; --line: #2c3550; --accent: #ff5cb8; } }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
      main { max-width: 720px; margin: 0 auto; padding: 48px 16px; }
      h1 { margin: 0 0 4px; font-size: 32px; }
      p { margin: 0 0 24px; color: var(--muted); }
      ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
      a { display: grid; gap: 2px; padding: 16px 18px; border: 1px solid var(--line); border-radius: 14px; background: var(--card); color: inherit; text-decoration: none; }
      a:hover, a:focus-visible { border-color: var(--accent); }
      .t { font-weight: 700; }
      .m { font-size: 14px; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Decks</h1>
      <p>1 presentación.</p>
      <ul>
      <li><a href="promociones-ml/"><span class="t">Promociones sin vueltas</span><span class="m">promociones-ml · actualizado el 02/10/2026</span></a></li>
      </ul>
    </main>
  </body>
</html>
